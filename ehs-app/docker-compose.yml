services:
  postgres:
    image: postgres:16-alpine
    container_name: ehs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ehs_app
      POSTGRES_USER: ehs
      POSTGRES_PASSWORD: ehs
    ports:
      - "5432:5432"
    volumes:
      - ehs-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ehs -d ehs_app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ehs-postgres-data:

